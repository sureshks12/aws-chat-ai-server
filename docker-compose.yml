version: '3.8'

services:
  # Database Service
  postgres:
    image: postgres:15-alpine
    container_name: aws_chat_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aws_chat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Express Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aws_chat_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/aws_chat_db?schema=public"
      JWT_SECRET: "super-secret-jwt-key-change-in-production"
      JWT_EXPIRES_IN: "24h"
      ENCRYPTION_KEY: "your-32-byte-encryption-secret-key-change-this"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-AQ.Ab8RN6IAWiPS8mJCbt_BMrNjz3jHjPLqiL31JRhzudELa4GVLA}"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  # React Frontend Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aws_chat_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
